<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cronograma de Atividades</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-icon" aria-hidden="true">📅</span>
      <span>Cronograma de Atividades</span>
    </a>
    <div class="topbar-search">
      <input id="global-search" type="search" placeholder="Buscar pastas e cronogramas…" autocomplete="off">
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btn-export" title="Baixar backup (JSON)">⬇<span class="lbl"> Exportar</span></button>
      <button class="btn btn-ghost" id="btn-import" title="Restaurar backup (JSON)">⬆<span class="lbl"> Importar</span></button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="btn btn-ghost btn-icon" id="btn-sidebar" title="Mostrar/ocultar pastas" aria-label="Mostrar/ocultar pastas">☰</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Pastas"></aside>
    <main id="main" class="main"></main>
  </div>

  <div id="modal-root"></div>
  <div id="ctx-menu" class="ctx-menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/explorer.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
